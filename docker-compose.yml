# ./start.sh --docker  (or start.cmd -Docker on Windows)  →  http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]

  media:
    # Live ingest (RTMP/RTMPS/SRT/WebRTC) and HLS for LoNo broadcasts. See docs/BROADCAST.md.
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      - ./media/certs:/certs:ro
    environment:
      MTX_AUTHHTTPADDRESS: http://backend:8001/api/broadcast/mtx/auth
      MTX_APIADDRESS: ":9997"
      MTX_HLSADDRESS: ":8888"
      MTX_RTSPADDRESS: ":8554"     # internal only (not published)
    ports:
      - "1935:1935"         # RTMP ingest
      - "1936:1936"         # RTMPS ingest (needs certs in media/certs)
      - "8890:8890/udp"     # SRT ingest
      - "8889:8889"         # WebRTC (browser camera) ingest
      - "8189:8189/udp"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.docker   # created by start.ps1 / start.sh, or copy .env.docker.example
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      LOCAL_STORAGE_DIR: /app/data/uploads
      MEDIA_ENABLED: "true"
      MEDIA_API_URL: http://media:9997
      MEDIA_HLS_URL: http://media:8888
      MEDIA_WEBRTC_URL: http://media:8889
      MEDIA_RTMP_INTERNAL: rtmp://media:1935
      MEDIA_RTSP_INTERNAL: rtsp://media:8554
      RECORDINGS_DIR: /app/data/recordings
    volumes: [uploads:/app/data/uploads]
    depends_on: [mongo, media]

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  mongo-data:
  uploads:
