server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location /.well-known/ { proxy_pass http://backend:8001; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
