# Behind Caddy (production) keep the original https scheme; on its own, use nginx's.
map $http_x_forwarded_proto $lono_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 0;              # the API enforces MAX_UPLOAD_MB (match replays can be gigabytes)
    client_body_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lono_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location /.well-known/ { proxy_pass http://backend:8001; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $lono_proto; }
    location /media/ { proxy_pass http://backend:8001; proxy_buffering off; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $lono_proto; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
