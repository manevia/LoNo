<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>LoNo · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .logo{width:56px;height:56px;border-radius:14px;background:#FF3B30;display:grid;place-items:center;font-weight:900;font-size:30px;margin:0 auto 20px}
  h1{font-size:24px;margin:0 0 8px} p{color:#9ca3af;margin:0 0 24px;max-width:32ch;line-height:1.5}
  button{background:#fff;color:#000;border:0;border-radius:999px;padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer}
  button:focus-visible{outline:3px solid #FFB000;outline-offset:3px}
</style>
</head>
<body><main><div>
  <div class="logo" aria-hidden="true">L</div>
  <h1>You're offline</h1>
  <p>LoNo needs a connection to stream. Check your data or Wi-Fi, then try again.</p>
  <button autofocus onclick="location.reload()">Try again</button>
</div></main></body>
</html>
